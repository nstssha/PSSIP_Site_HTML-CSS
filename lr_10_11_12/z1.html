<!DOCTYPE html>
<html>
<head>
    <title>Задание 1</title>
    <script>
        function showMonth() {
            let now = new Date();
            // getMonth() возвращает 0-11, поэтому прибавляем 1
            let month = now.getMonth() + 1;
            alert("Номер текущего месяца: " + month);
        }
    </script>
</head>
<body>
    <button onclick="showMonth()">Показать месяц</button>
</body>
</html>
