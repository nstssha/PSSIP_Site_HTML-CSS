<!DOCTYPE html>
<html>
<body>
    <script>
        let arr = [15, 3, 42, 8, 21, 56, 10];
        let max = arr[0];

        for (let i = 1; i < arr.length; i++) {
            if (arr[i] > max) {
                max = arr[i];
            }
        }

        document.write("Массив: " + arr.join(", ") + "<br>");
        document.write("Максимальный элемент: " + max);
    </script>
</body>
</html>
