<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задания 1 и 2</title>

    <!-- СПОСОБ 1: Внедрение скрипта в секцию <head> -->
    <script>
        console.log("Способ 1: Скрипт в Head загружен.");
    </script>

    <!-- СПОСОБ 2: Подключение внешнего файла (Задание №2) -->
    <!-- Здесь мы подключаем наш файл operators.js -->
    <script src="script.js"></script>
</head>
<body>

    <h1>Практическая работа по JS</h1>
    <p>Нажмите на кнопки, чтобы проверить способы внедрения:</p>

    <!-- СПОСОБ 3: Инлайновый (встроенный) обработчик события -->
    <button onclick="alert('Способ 3: Скрипт прямо в теге кнопки!')">
        Инлайновый скрипт
    </button>

    <!-- Кнопка для запуска кода из внешнего файла (Задания 2) -->
    <button onclick="runOperatorDemo()">
        Запустить операторы (из внешнего файла)
    </button>

    <!-- СПОСОБ 4: Внедрение скрипта в конце тела <body> -->
    <script>
        document.write("<p style='color:blue;'>Способ 4: Скрипт в конце Body добавил этот текст.</p>");
        console.log("Способ 4: Скрипт в конце Body выполнен.");
    </script>

</body>
</html>
